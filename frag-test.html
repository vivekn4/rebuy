<!doctype html>
<html><head><meta charset="utf-8"><title>frag-test</title></head>
<body><pre id="o">running...</pre>
<script>
var h = location.hash || "(empty)";
var m = /^#ebay-setup=([A-Za-z0-9\-_]+=*)$/.exec(h);
var out = "hashLen=" + h.length + "\nmatch=" + !!m;
if (m) {
  try {
    var b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var o = JSON.parse(atob(b64));
    out += "\nparsed=ok\nclientIdHead=" + String(o.clientId || "").slice(0, 10) + "\nhasSecret=" + !!o.clientSecret;
  } catch (e) { out += "\nparseError=" + e.message; }
}
document.getElementById("o").textContent = out;
</script>
</body></html>
